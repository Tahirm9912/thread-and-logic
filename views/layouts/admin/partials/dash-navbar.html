<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
  .admin-navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: black;
    padding: 12px 25px;
  }

  .nav-left, .nav-right {
    display: flex;
    gap: 15px;
  }

  .admin-navbar a {
    color: white;
    text-decoration: none;
    padding: 8px 14px;
    border-radius: 6px;
    font-size: 14px;
    transition: 0.2s;
  }

  .admin-navbar a:hover {
    background: #333;
  }

  /* Active link */
  .admin-navbar a.active {
    background: white;
    color: black;
    font-weight: 500;
  }

  /* Logout button */
  .logout {
    background: red;
  }

  .logout:hover {
    background: darkred;
  }
</style>
</head>
<body>
    <nav class="admin-navbar">

  <div class="nav-left">
    <a href="/admin/orders">Orders</a>
    <a href="/admin/order-tracking">Order Tracking</a>
    <a href="/admin/products">Products</a>
    <a href="/admin/add-product">Add Product</a>
    <a href="/admin/stats">Stats</a>
  </div>

  <div class="nav-right">
    <a href="/logout" class="logout">Logout</a>
  </div>

</nav>


</body>
</html>
